<!DOCTYPE html>
<html>
<head>
<title>Wayback Machine</title>

<style><!-- custom_cxmoscow_style -->
body {
    background-color: #4f5ba9 !important;
    color: #FFFFFF !important;
}
.level_name h2, .gnum {
    color: #FFFF00 !important;
}
#hint {
    background-color: #FFFACD !important;
    color: #000080 !important;
    border: 1px solid #DAA520 !important;
    padding: 4px 8px !important;
    margin: 4px 0 !important;
}
img.image-not-available {
    border: 2px dashed #DAA520 !important;
    padding: 5px !important;
    opacity: 0.8 !important;
}
</style>
<style>
/* Стилизация схватка.cx */
body {
    background-color: #4f5ba9;
    color: #FFFFFF;
    font-family: 'Trebuchet MS', Arial, sans-serif;
    margin: 20px;
    max-width: 900px;
    margin-left: auto;
    margin-right: auto;
}
h1 {
    color: #FFFF00;
    text-align: center;
    border-bottom: 2px solid #DAA520;
    padding-bottom: 10px;
}
h2 {
    color: #FFFF00;
    background-color: #3a4585;
    padding: 8px 12px;
    border-radius: 4px;
}
.gnum {
    color: #FFFF00;
    font-size: 1.2em;
}
#scen, .scen {
    background-color: #3a4585;
    padding: 15px;
    border-radius: 8px;
    margin: 10px 0;
}
#hint, .hint-box {
    background-color: #FFFACD;
    color: #000080;
    border: 1px solid #DAA520;
    padding: 6px 10px;
    margin: 4px 0;
    border-radius: 4px;
    display: inline-block;
    max-width: 80%;
}
#ltxt {
    display: inline-block;
    vertical-align: middle;
    margin-right: 5px;
}
strong {
    color: #FFD700;
}
a {
    color: #87CEEB;
}
img[src="hint.gif"] {
    width: 16px;
    height: 16px;
    vertical-align: middle;
}
img[src="image_not_available.png"] {
    border: 2px dashed #DAA520;
    padding: 5px;
    background-color: #4f5ba9;
    max-width: 300px;
}
table {
    border-collapse: collapse;
    width: 100%;
    margin: 10px 0;
}
td, th {
    border: 1px solid #666;
    padding: 4px 8px;
}
th {
    background-color: #3a4585;
    color: #FFFF00;
}
</style>
